name: app
description: CartBot ESP32 robot wireless controller
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.5.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  vibration: ^3.1.3
  permission_handler: ^12.0.1
  network_info_plus: ^7.0.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Typography: Orbitron, Exo 2, Share Tech Mono — loaded at runtime via google_fonts
