name: cartbot
description: CartBot ESP32 robot wireless controller
publish_to: "none"
version: 1.0.2+3


environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.5.1
  shared_preferences: ^2.5.3
  vibration: ^3.1.3
  permission_handler: ^12.0.1
  network_info_plus: ^7.0.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Exo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Exo2-Bold.ttf
          weight: 700
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
          weight: 400
